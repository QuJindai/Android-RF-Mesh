name: V0.9 Release APK Fixed Carrier

on:
  push:
    branches: [ release/v0.9.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release carrier
        uses: actions/checkout@v4

      - name: Restore canonical V0.9 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find snapshot/fix -maxdepth 1 -name 'part-00-*.b64' | wc -l)" -eq 5
          test "$(find snapshot/fix -maxdepth 1 -name 'part-01-*.b64' | wc -l)" -eq 5
          cat \
            snapshot/fix/part-00-*.b64 \
            snapshot/fix/part-01-*.b64 \
            snapshot/part-02.b64 snapshot/part-03.b64 snapshot/part-04.b64 \
            snapshot/part-05.b64 snapshot/part-06.b64 snapshot/part-07.b64 \
            snapshot/part-08.b64 snapshot/part-09.b64 snapshot/part-10.b64 \
            snapshot/part-11.b64 \
            > /tmp/android-rf-mesh-v090.b64
          base64 -d /tmp/android-rf-mesh-v090.b64 > /tmp/android-rf-mesh-v090.tar.gz
          echo 'a0604edd394d151eaf49b2fa24a9ec8ac0546ae11b73bcaece1f7182dd899f4a  /tmp/android-rf-mesh-v090.tar.gz' | sha256sum -c -
          mkdir -p /tmp/android-rf-mesh-v090
          tar -xzf /tmp/android-rf-mesh-v090.tar.gz -C /tmp/android-rf-mesh-v090
          test -x /tmp/android-rf-mesh-v090/repo/scripts/test-all.sh
          test -x /tmp/android-rf-mesh-v090/repo/scripts/build-apk.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Toolchain evidence
        shell: bash
        run: |
          java -version
          kotlinc -version

      - name: Run V0.9 source gates
        working-directory: /tmp/android-rf-mesh-v090/repo
        shell: bash
        run: ./scripts/test-all.sh

      - name: Install Android Platform 35 / Build-Tools 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build and verify V0.9 APK
        working-directory: /tmp/android-rf-mesh-v090/repo
        shell: bash
        env:
          ARFM_VERSION_NAME: 0.9.0
          ARFM_VERSION_CODE: 900
          ARFM_APK_OUT: ${{ github.workspace }}/dist/Android-RF-Mesh-v0.9.0-official.apk
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          ./scripts/build-apk.sh | tee "${GITHUB_WORKSPACE}/dist/build-apk.log"
          APK="${GITHUB_WORKSPACE}/dist/Android-RF-Mesh-v0.9.0-official.apk"
          test -s "$APK"
          python3 scripts/verify-apk-launcher.py "$APK" \
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            "$ANDROID_HOME/build-tools/35.0.0/dexdump"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "versionCode='900' versionName='0.9.0'"
          for descriptor in \
            'Lio/github/androidrfmesh/app/MeshService;' \
            'Lio/github/androidrfmesh/app/transport/CompositePeerTransport;' \
            'Lio/github/androidrfmesh/app/transport/BleMeshTransport;' \
            'Lio/github/androidrfmesh/app/transport/BleL2capUpgrade;' \
            'Lio/github/androidrfmesh/app/transport/WifiAwareTransport;'; do
            "$ANDROID_HOME/build-tools/35.0.0/dexdump" -d "$APK" | grep -F "$descriptor" >/dev/null
          done
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload V0.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-RF-Mesh-v0.9.0-official
          path: |
            dist/Android-RF-Mesh-v0.9.0-official.apk
            dist/Android-RF-Mesh-v0.9.0-official.apk.sha256
            dist/build-apk.log
          if-no-files-found: error
